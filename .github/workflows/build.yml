name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install --upgrade buildozer Cython==0.29.33

    - name: Pre-install Android SDK Build-Tools & Platform-Tools
      run: |
        # Buildozer'ın aradığı aidl ve platform araçlarının eksiksiz inmesi için sdkmanager ile hazırlık yapalım
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME
        # Buildozer kendi SDK'sını otomatik indirecektir, buradaki adım ek güvencedir.

    - name: Build with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk

