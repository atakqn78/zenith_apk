name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 wget

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install --upgrade buildozer Cython==0.29.33

    - name: Setup Android SDK Path and Tools
      run: |
        # Buildozer'in SDK'yi arayacagi ana dizini olusturalim
        ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME
        
        # Command line tools'u indirip Buildozer'in bekledigi yere kuralim
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d temp_tools
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        mv temp_tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
        rm -rf cmdline-tools.zip temp_tools

        # Sdkmanager ve platform-tools sembolik baglantilari ve ortam degiskenleri
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        # Lisanslari otomatik kabul ettirelim
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0" || true

    - name: Build with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
