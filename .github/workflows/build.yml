name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Repo'ya Git
      uses: actions/checkout@v4

    - name: Java Kurulumu (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Sistem Bağımlılıklarını Yükle
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libltdl-dev \
          libffi-dev \
          libssl-dev \
          libsqlite3-dev \
          zlib1g-dev \
          ant \
          autoconf \
          automake \
          libtool \
          pkg-config \
          libncurses5:i386 \
          libstdc++6:i386 \
          zlib1g:i386

    - name: Pip ve Buildozer'ı Yükle
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade buildozer cython==0.29.36

    - name: Buildozer ile APK Derle
      run: |
        buildozer -v android debug

    - name: APK Dosyasını Kaydet (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: zenith-apk
        path: bin/*.apk
